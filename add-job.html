<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Tracker Application</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container my-5">
    <nav class="d-flex justify-content-end gap-2 mb-4" aria-label="Main navigation">
        <a class="btn btn-info" href="add-job.html" aria-current="page">Add Job</a>
        <a class="btn btn-info" href="dashboard.html">Dashboard</a>
    </nav>

    <div class="job-form p-4">
        <h2 class="mb-4">Add Job</h2>

        <form id="jobForm">
            <div class="row g-3">

                <!-- Position -->
                <div class="col-md-4">
                    <label class="form-label">Position</label>
                    <input type="text" class="form-control" id="position">
                </div>

                <!-- Company -->
                <div class="col-md-4">
                    <label class="form-label">Company</label>
                    <input type="text" class="form-control" id="company">
                </div>

                <!-- Location -->
                <div class="col-md-4">
                    <label class="form-label">Job Location</label>
                    <input type="text" class="form-control" id="location">
                </div>

                <!-- Status -->
                <div class="col-md-4">
                    <label class="form-label">Job Status</label>
                    <select class="form-select" id="status">
                        <option>Applied</option>
                        <option>Interview</option>
                        <option>Offer</option>
                        <option>Rejected</option>
                    </select>
                </div>

                <!-- Type -->
                <div class="col-md-4">
                    <label class="form-label">Job Type</label>
                    <select class="form-select" id="type">
                        <option>Full-time</option>
                        <option>Part-time</option>
                        <option>Remote</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Application Date</label>
                    <input
                        type="date"
                        class="form-control"
                        id="applicationDate">
                </div>

                <!-- Upload CV -->
                <div class="col-md-8">
                    <label class="form-label">Upload CV</label>
                    <input
                        type="file"
                        class="form-control"
                        id="resume"
                        accept=".pdf,.doc,.docx"
                    >
                </div>

                <!-- Submit -->
                <div class="col-md-4 d-flex align-items-end">
                   <button
                        type="submit"
                        class="btn submit-btn w-100">
                        Add Job
                    </button>

                </div>

            </div>
        </form>
    </div>
</div>

<div class="row mt-4" id="jobList">

</div>
<script src="add-job.js"></script>
</body>
</html>
