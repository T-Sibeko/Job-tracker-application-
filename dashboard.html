<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Tracker Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container my-5">
        <nav class="d-flex justify-content-end gap-2 mb-4" aria-label="Main navigation">
            <a class="btn btn-info" href="add-job.html">Add Job</a>
            <a class="btn btn-info" href="dashboard.html" aria-current="page">Dashboard</a>
        </nav>

        <h1 class="mb-4">Job Dashboard</h1>

        <section class="row" aria-label="Job application statistics">
            <div class="col-md-3">
                <div class="stat-card">
                    <h2 id="totalJobs">0</h2>
                    <p>Total Jobs</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <h2 id="interviewJobs">0</h2>
                    <p>Interviews</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <h2 id="offerJobs">0</h2>
                    <p>Offers</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <h2 id="rejectedJobs">0</h2>
                    <p>Rejected</p>
                </div>
            </div>
        </section>

        <section class="job-form mt-4 p-4">
            <h2 class="mb-4">Job Status Overview</h2>
            <canvas id="jobChart" aria-label="Applications by job status" role="img"></canvas>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
